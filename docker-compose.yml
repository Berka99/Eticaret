version: '3.8'

services:
  # MongoDB Servisi
  mongodb:
    image: mongo:6.0
    container_name: devsecops-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: sadeoyuncu81_db_user
      MONGO_INITDB_ROOT_PASSWORD: hY7t7zv8l9NkjyNn
    volumes:
      - mongo-data:/data/db

  # Node.js Backend Servisi
  backend:
    build: ./backend
    container_name: devsecops-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      # MongoDB bağlantı adresi (localhost yerine konteyner adı olan 'mongodb' yazılır)
      MONGO_URI: mongodb://admin:secretpassword@mongodb:27017/mydatabase?authSource=admin
    depends_on:
      - mongodb

volumes:
  mongo-data:
